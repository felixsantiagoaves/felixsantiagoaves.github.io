<svg id="mascotsvg" role="img" aria-label="Caranchito animado" viewBox="20 8 240 392" width="240" height="392" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
  <style>
#m-root{transform-box:view-box;transform-origin:150px 390px;animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
#m-head{transform-box:view-box;transform-origin:118px 140px;animation:hd 6s ease-in-out infinite}
@keyframes hd{0%,100%{transform:rotate(0)}18%{transform:rotate(5deg)}34%{transform:rotate(-3deg)}52%{transform:rotate(7deg)}70%{transform:rotate(-2deg)}}
#m-jaw{transform-box:view-box;transform-origin:92px 96px;animation:jw 6s ease-in-out infinite}
@keyframes jw{0%,46%,60%,100%{transform:rotate(0)}50%,56%{transform:rotate(-20deg)}}
#m-lid{animation:bl 4.4s infinite}
@keyframes bl{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
#m-tail{transform-box:view-box;transform-origin:190px 268px;animation:tl 2.6s ease-in-out infinite}
@keyframes tl{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
#m-wing{transform-box:view-box;transform-origin:140px 190px;animation:wg 7s ease-in-out infinite}
@keyframes wg{0%,80%,100%{transform:rotate(0)}86%{transform:rotate(-14deg)}92%{transform:rotate(0)}96%{transform:rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
  <g id="m-root">
    <!-- cola -->
    <g id="m-tail">
      <path d="M196 262 C 226 296, 246 340, 252 388 L 214 392 C 204 350, 190 312, 176 276 Z" fill="#4b3324" stroke="#2a1f14" stroke-width="3" stroke-linejoin="round"/>
      <path d="M190 318 L 232 312 M 196 342 L 240 338 M 203 366 L 247 362" stroke="#e9d8bc" stroke-width="7" stroke-linecap="round"/>
      <path d="M212 384 L 252 380 L 252 388 L 214 392 Z" fill="#f2e8d5"/>
    </g>
    <!-- patas -->
    <g id="m-legB">
      <path d="M176 288 L 170 372" stroke="#d99a2b" stroke-width="12" stroke-linecap="round"/>
      <path d="M170 372 L 142 390 M 170 372 L 166 392 M 170 372 L 196 388" stroke="#d99a2b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="m-legF">
      <path d="M142 290 L 136 372" stroke="#e8a834" stroke-width="12" stroke-linecap="round"/>
      <path d="M136 372 L 108 391 M 136 372 L 132 393 M 136 372 L 162 389" stroke="#e8a834" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- cuerpo -->
    <path id="m-body" d="M96 150 C 66 222, 86 304, 150 318 C 220 330, 242 250, 218 194 C 200 150, 132 118, 96 150 Z" fill="#6c4a33" stroke="#2a1f14" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- pecho barrado -->
    <path d="M96 150 C 70 222, 90 298, 148 316 C 132 262, 128 204, 130 140 Z" fill="#ead9bd"/>
    <path d="M84 178 L 126 170 M 80 196 L 128 190 M 79 214 L 130 210 M 80 232 L 132 230 M 84 250 L 133 250 M 92 268 L 136 270 M 104 286 L 140 290" stroke="#6c4a33" stroke-width="4" stroke-linecap="round"/>
    <!-- ala -->
    <g id="m-wing">
      <path d="M132 176 C 192 158, 250 204, 236 288 C 208 320, 160 304, 136 252 Z" fill="#46301f" stroke="#2a1f14" stroke-width="3" stroke-linejoin="round"/>
      <path d="M150 214 q 26 14 58 -4 M 148 240 q 30 16 64 -4 M 152 266 q 26 14 54 -4" stroke="#a68058" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M170 196 L 208 190 M 168 228 L 214 222" stroke="#c9a574" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    </g>
    <!-- cuello + cabeza -->
    <g id="m-head">
      <path d="M92 156 C 80 126, 84 98, 98 78 L 152 72 C 154 100, 146 126, 132 148 Z" fill="#efdfc3" stroke="#2a1f14" stroke-width="3" stroke-linejoin="round"/>
      <path d="M94 112 L 132 108 M 92 126 L 136 124 M 96 140 L 136 138" stroke="#7f5539" stroke-width="3" stroke-linecap="round" opacity=".7"/>
      <path d="M90 70 C 96 82, 126 84, 148 74 L 154 92 C 138 108, 106 108, 92 94 Z" fill="#efdfc3" stroke="#2a1f14" stroke-width="3" stroke-linejoin="round"/>
      <path d="M86 66 C 88 28, 138 14, 170 36 L 200 42 C 192 50, 204 48, 210 52 C 194 60, 166 58, 148 68 C 128 76, 100 76, 86 66 Z" fill="#1d1612" stroke="#0f0b08" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="82" cy="80" rx="17" ry="15" fill="#ee8a3c" stroke="#2a1f14" stroke-width="3"/>
      <path d="M76 68 C 56 62, 36 72, 31 93 C 29 106, 33 117, 40 119 C 47 115, 45 104, 54 98 C 64 94, 74 95, 86 95 Z" fill="#bcc3c2" stroke="#2a1f14" stroke-width="3" stroke-linejoin="round"/><circle cx="62" cy="78" r="2.4" fill="#5f6a69"/>
      <path d="M31 93 C 29 106, 33 117, 40 119 C 45 116, 45 108, 47 102 C 40 103, 33 99, 31 93 Z" fill="#7d8786"/>
      <g id="m-jaw">
        <path d="M56 101 C 64 106, 80 105, 94 97 L 88 92 C 78 96, 66 96, 60 94 Z" fill="#aeb6b5" stroke="#2a1f14" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
      <circle cx="116" cy="66" r="12" fill="#f3e8d3" stroke="#2a1f14" stroke-width="2.5"/>
      <g id="m-pupil"><circle cx="116" cy="66" r="7.5" fill="#1a110b"/><circle cx="113.5" cy="63" r="2.4" fill="#fff"/></g>
      <ellipse id="m-lid" cx="116" cy="66" rx="12.5" ry="12.5" fill="#1d1612" style="transform-box:fill-box;transform-origin:50% 0%;transform:scaleY(0)"/>
    </g>
  </g>
</svg>
