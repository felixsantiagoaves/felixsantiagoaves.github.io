function tintada(im,s,col){const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');const k=Math.min(s/im.width,s/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,(s-w)/2,(s-h)/2,w,h);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,s,s);return c}

function lineas(x,t,mw,max){const p=t.split(' ');let l=[],c='';for(const w of p){const n=c?c+' '+w:w;if(x.measureText(n).width>mw&&c){l.push(c);c=w}else c=n}if(c)l.push(c);return l.slice(0,max)}

async function figuCanvas(x,i,cx,cy,w,rot){const s=SP[i],h=w*1.4,p=w*.055,pic=w-2*p,rara=s[4]<.5,mit=s[4]<.05;

 if(rara||mit){x.lineWidth=w*.025;x.strokeStyle=mit?C.oro:C.rojo;rr(x,-w/2,-h/2,w,h,w*.03);x.stroke()}
 x.fillStyle=ZC[s.zb];x.fillRect(-w/2+p,-h/2+p,pic,pic);
 const im=await siluImg(silDe(i));if(im){x.globalAlpha=.85;const t=tintada(im,Math.round(pic*.78),'#3a4029');x.drawImage(t,-t.width/2,-h/2+p+(pic-t.width)/2);x.globalAlpha=1}
 x.textAlign='center';x.fillStyle=C.ink;let fs=w*.088;x.font=`900 ${fs}px ${FL}`;const nm=s[1].toUpperCase();let L=lineas(x,nm,w-2*p,2);
 while(L.join(' ').length<nm.length&&fs>w*.05){fs*=.92;x.font=`900 ${fs}px ${FL}`;L=lineas(x,nm,w-2*p,2)}

/* Sonido: música generativa suave + ambiente según el clima + trinos sintéticos + cantos reales (xeno-canto) */
const MU={on:false,amb:'day',n:0};
const mf=m=>440*Math.pow(2,(m-69)/12);
function actx(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
const PAD=[[50,57,61,66],[47,54,57,62],[43,50,54,59],[45,52,57,61]],PEN=[62,64,66,69,71,74,76,78];
function ruido(c,s){const b=c.createBuffer(1,c.sampleRate*s,c.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){l=.97*l+.03*(Math.random()*2-1);d[i]=l*6}return b}
function musica(on){if(on&&!MU.on){const c=actx();if(!c)return;MU.on=true;armar(c)}else if(!on&&MU.on){MU.on=false;if(MU.bus){const c=AC;MU.bus.gain.cancelScheduled&&MU.bus.gain.cancelScheduledValues(c.currentTime);MU.bus.gain.setTargetAtTime(0,c.currentTime,.3)}clearInterval(MU.t);cantoStop()}}
function armar(c){
 if(!MU.bus){const bus=c.createGain();bus.gain.value=0;bus.connect(c.destination);
  const d=c.createDelay(1);d.delayTime.value=.42;const fb=c.createGain();fb.gain.value=.36;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2000;const wet=c.createGain();wet.gain.value=.5;
  bus.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(wet);wet.connect(c.destination);
  const nz=c.createBufferSource();nz.buffer=ruido(c,3);nz.loop=true;const nf=c.createBiquadFilter();nf.type='bandpass';nf.frequency.value=500;nf.Q.value=.6;const ng=c.createGain();ng.gain.value=.02;nz.connect(nf);nf.connect(ng);ng.connect(bus);nz.start();
  const lfo=c.createOscillator();lfo.frequency.value=.12;const lg=c.createGain();lg.gain.value=.012;lfo.connect(lg);lg.connect(ng.gain);lfo.start();
  MU.bus=bus;MU.ng=ng;MU.nf=nf;MU.t0=c.currentTime;MU.next={pad:c.currentTime+.2,mel:c.currentTime+2,bird:c.currentTime+4,amb:c.currentTime+1};MU.ci=0}
 MU.bus.gain.cancelScheduledValues&&MU.bus.gain.cancelScheduledValues(c.currentTime);MU.bus.gain.setTargetAtTime(.55,c.currentTime,1.2);
 clearInterval(MU.t);MU.t=setInterval(tick,300);ambiente(MU.amb)}
function env(c,g,t,a,d,v){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function nota(c,f,t,a,d,v,tipo,out){const o=c.createOscillator(),g=c.createGain();o.type=tipo||'triangle';o.frequency.value=f;env(c,g,t,a,d,v);o.connect(g);g.connect(out||MU.bus);o.start(t);o.stop(t+a+d+.1)}
function chirp(c,k,t,vol){const p=c.createStereoPanner?c.createStereoPanner():null;if(p)p.pan.value=Math.random()*1.6-.8;const out=p||MU.bus;if(p)p.connect(MU.bus);
 const g=(f0,f1,t0,d,v)=>{const o=c.createOscillator(),ga=c.createGain();o.type='sine';o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(f1,t0+d);env(c,ga,t0,d*.25,d*.75,v);o.connect(ga);ga.connect(out);o.start(t0);o.stop(t0+d+.05)};
 const b=2200+Math.random()*1800,v=vol||.04;
 if(k===0){g(b,b*1.5,t,.28,v)}
 else if(k===1){const n=5+Math.floor(Math.random()*5);for(let i=0;i<n;i++)g(b,b*.9,t+i*.055,.04,v*.8)}
 else if(k===2){g(b*.7,b*.55,t,.18,v);g(b*.7,b*.55,t+.26,.18,v)}
 else if(k===3){g(b*.8,b*1.3,t,.1,v);g(b*.9,b*1.5,t+.16,.1,v);g(b,b*.8,t+.34,.16,v)}
 else{for(let i=0;i<3;i++)g(b*(1+i*.12),b*(1.2+i*.12),t+i*.14,.09,v)}}
function grillo(c,t){const o=c.createOscillator(),g=c.createGain(),m=c.createOscillator(),mg=c.createGain();o.frequency.value=4300;m.frequency.value=22;mg.gain.value=.5;g.gain.value=0;m.connect(mg);mg.connect(g.gain);const e=c.createGain();e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(.012,t+.2);e.gain.exponentialRampToValueAtTime(.0001,t+1.4);o.connect(g);g.connect(e);e.connect(MU.bus);o.start(t);m.start(t);o.stop(t+1.5);m.stop(t+1.5)}
function rafaga(c,t,d,f,v,tp){const s=c.createBufferSource();s.buffer=MU.nb||(MU.nb=ruido(c,2));const fl=c.createBiquadFilter();fl.type=tp||'highpass';fl.frequency.value=f;const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(MU.bus);s.start(t,Math.random());s.stop(t+d+.05)}
function ambiente(w){MU.amb=w;if(!MU.ng||!AC)return;const c=AC,t=c.currentTime,P={day:[.02,500],dawn:[.018,500],dusk:[.02,420],night:[.012,300],rain:[.05,1400],storm:[.08,900],wind:[.07,700],fog:[.012,350],heat:[.015,600],frost:[.03,800],fire:[.03,1000]}[w]||[.02,500];MU.ng.gain.setTargetAtTime(P[0],t,1.5);MU.nf.frequency.setTargetAtTime(P[1],t,1.5)}
function tick(){if(!MU.on||!AC||AC.state!=='running')return;const c=AC,now=c.currentTime,N=MU.next,w=MU.amb;
 while(N.pad<now+1.5){const ch=PAD[MU.ci++%4];ch.forEach((m,i)=>{nota(c,mf(m+(i>0?12:0)),N.pad+i*.07,2.4,5.2,.05,'triangle')});N.pad+=7.6}
 while(N.mel<now+1.2){if(Math.random()<(w==='storm'?.3:.62)){const m=PEN[Math.floor(Math.random()*PEN.length)];nota(c,mf(m),N.mel,.012,1.6,.05,'triangle')}N.mel+=.7+Math.random()*1.5}
 while(N.bird<now+1.2){const day=w!=='night';if(day&&w!=='storm'&&w!=='fire'){chirp(c,Math.floor(Math.random()*5),N.bird,w==='rain'?.02:.04)}else if(w==='night'){if(Math.random()<.5)grillo(c,N.bird);else{const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(380,N.bird);o.frequency.exponentialRampToValueAtTime(320,N.bird+.5);env(c,g,N.bird,.12,.5,.05);o.connect(g);g.connect(MU.bus);o.start(N.bird);o.stop(N.bird+.7)}}

let _ca=null,_cp=false;
function cargarCantos(cb){if(typeof CANTOS!=='undefined'){cb&&cb();return}if(_cp)return;_cp=true;try{const s=document.createElement('script');s.src='/assets/cantos.js';s.onload=()=>cb&&cb();s.onerror=()=>{};document.body.appendChild(s)}catch(e){}}
function cantoDe(i){return(typeof CANTOS!=='undefined')?CANTOS[SP[i][2]]:null}
function duck(on){if(MU.bus&&AC)MU.bus.gain.setTargetAtTime(on?.15:.55,AC.currentTime,.4)}
function cantoStop(){if(_ca){try{_ca.pause()}catch(e){}_ca=null}duck(false)}
function cantoReal(i){if(!SND||window.SIMULA)return;const ct=cantoDe(i);if(!ct)return;cantoStop();const au=new Audio('https://xeno-canto.org/'+ct.xc+'/download');au.volume=.9;_ca=au;duck(true);au.play().catch(()=>{cantoStop()});au.onended=()=>{if(_ca===au)cantoStop()};setTimeout(()=>{if(_ca===au)cantoStop()},15000)}
function cantoCred(i){const ct=cantoDe(i);if(!ct)return '';return `<button class="btn md" style="background:transparent;color:#f3d77c;box-shadow:inset 0 0 0 2px #f3d77c" onclick="cantoReal(${i})">Escuchar su ${ct.tipo&&ct.tipo.startsWith('grab')?'grabación':ct.tipo||'canto'}</button><p class="cred">${ct.pais?'Grabación de '+ct.pais:'Argentina'} · ${ct.autor} · xeno-canto XC${ct.xc}</p>`}
function sndToggle(b){SND=!SND;b.textContent=SND?'Sonido: sí':'Sonido: no';if(SND)musica(true);else musica(false)}

function sfx(k){if(!SND)return;const c=actx();if(!c)return;if(!MU.bus){armar(c);MU.on=true}const t=c.currentTime+.01;
 if(k==='bien'){[659,880].forEach((f,i)=>nota(c,f,t+i*.1,.01,.5,.07,'triangle'))}
 else if(k==='mal'){nota(c,196,t,.01,.45,.08,'sawtooth');nota(c,147,t+.12,.01,.5,.07,'sawtooth')}
 else if(k==='suerte'){[784,988,1175,1568].forEach((f,i)=>nota(c,f,t+i*.08,.01,.6,.06,'triangle'))}
 else if(k==='ave'){chirp(c,Math.floor(Math.random()*5),t,.06)}}

 const ok=(e)=>(!e.z||e.z.includes(G.zona))&&(!e.x||G.P.exp);
 let pool=G.evs.filter(j=>ok(EV[j]));if(!pool.length){G.evs=EV.map((_,j)=>j);pool=G.evs.filter(j=>ok(EV[j]))}
 const j=pool[Math.floor(G.r()*pool.length)];G.evs.splice(G.evs.indexOf(j),1);G.ev=G.P.exp?expertoEv(EV[j]):EV[j];
 $(cab()+escena(G.zona,G.ev.w,nota(G.mes))+`<div><p class="lab">${MESES[G.mes]} · ${G.lugar.n}</p><h2>${G.ev.q}</h2></div>
 ${tip(TIPS[3])}<div class="ops">${G.ev.o.map((o,k)=>{const bl=o=>(o.en<0&&G.en+o.en<0)||(o.na<0&&G.nafta+o.na<0),todos=G.ev.o.every(bl),no=bl(o)&&!(todos&&k===G.ev.o.length-1);return `<button class="op" ${no?'disabled':''} onclick="elegirEv(${k})"><b>${o.t}</b><span>${o.s}</span>${chips(o)}<small>${G.P.pistas||/energía|nafta/.test(o.c)?o.c:''}${no?' · no te alcanza':''}</small></button>`}).join('')}</div>`)}
function elegirEv(k){resolver(G.ev.o[k])}
function resolver(o){if(o.perm){G.permM=(G.permM||1)*o.perm;pop('Aprendiste del lugar: rendís más el resto del año')}if(o.en<0||o.na<0)pop(deltas(o),true);let ef=(o.ef||1)*(G.mod||1)*(G.permM||1),msg='';
 if(o.en)G.en=Math.max(0,Math.min(4,G.en+o.en));if(o.na)G.nafta=Math.max(0,G.nafta+o.na);
 if(o.az){const mal=G.r()<o.az[0];ef=mal?o.az[1]:o.az[2];msg=mal?o.az[3]:o.az[4]}
 if(G.P.amp)ef=Math.pow(ef,ef<1?G.P.amp[0]:G.P.amp[1]);if(G.en===0){ef*=G.P.exp?.55:.8;msg+=(msg?' ':'')+'Estás fundido: rendís menos hasta que descanses.'}
 const zi=ZK.indexOf(G.zona),nuevas=[];let rep=0;
 for(let i=0;i<N;i++){const x=SP[i];if(x[4]<G.P.fmin)continue;let e=ef;if(o.ari&&x[4]<2)e*=o.ari;if(G.ari>1&&x[4]<2)e*=G.ari;if(o.fam&&o.fam[0].includes(x[3]))e*=o.fam[1];
  const p=1-Math.pow(1-Math.min(.8,prob(i,zi,G.mes)*MK(G.lugar)),e);if(G.r()<p){if(G.vistas.has(x[0]))rep++;else{G.vistas.add(x[0]);nuevas.push(i)}}}
 if(o.rara!=null){if(G.r()<o.rara){const cand=SP.map((x,i)=>i).filter(i=>!G.vistas.has(SP[i][0])&&SP[i][4]<Math.max(1.5,G.P.fmin*3)&&SP[i][4]>=Math.max(.02,G.P.fmin)),wt=i=>Math.sqrt(SP[i][4]);const tot=cand.reduce((a,i)=>a+wt(i),0);let u=G.r()*tot,pick=null;for(const i of cand){u-=wt(i);if(u<=0){pick=i;break}}if(pick!=null){G.vistas.add(SP[pick][0]);nuevas.unshift(pick);msg='Estaba. Dos horas de ruta y ahí la tenías: '+SP[pick][1]+'.'}}else msg='Llegaste y ya no estaba. Así es esto.'}
 if(G.mod<1)msg+=(msg?' ':'')+'Saliste en desventaja este mes.';
 nuevas.sort((a,b)=>SP[a][4]-SP[b][4]);if(!window.SIMULA)nuevas.slice(0,5).forEach((_,k)=>setTimeout(()=>sfx('ave'),350+k*200));
 G.log.push({m:G.mes,z:G.lugar.n,n:nuevas.length,ids:nuevas});
 const fin=G.k===G.P.cal.length-1;
 $(cab()+escena(G.zona,G.ev.w,'')+`<div><p class="lab">${MESES[G.mes]} · ${G.lugar.n}</p><h2>${nuevas.length?'+'+nuevas.length+' especie'+(nuevas.length>1?'s':'')+' nueva'+(nuevas.length>1?'s':''):'Nada nuevo esta vez'}</h2><p class="sub">${rep} repetidas. Llevás ${G.vistas.size} en el año.</p></div>
 ${msg?`<p class="nota">${msg}</p>`:''}
 <div class="figus">${nuevas.slice(0,60).map(figu).join('')}</div>${nuevas.length>60?`<p class="pie">…y ${nuevas.length-60} más que ya quedaron en tu libreta.</p>`:''}
 <button class="btn" onclick="${fin?'final()':'sig()'}">${fin?'Cerrar el año':'Siguiente mes'}</button>`);revelar(nuevas.filter(i=>SP[i][4]<.5).sort((a,b)=>SP[b][4]-SP[a][4]))}
const AVE='<svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="19" cy="25" rx="12" ry="8"/><circle cx="29" cy="15" r="5.5"/><path d="M33 13.5l7 2.5-7 3z"/><path d="M9 24L1 31l11-3z"/></svg>';
const pc=v=>(v>=10?Math.round(v):v>=1?v.toFixed(1):v>=.1?v.toFixed(2):v.toFixed(3)).toString().replace('.',',')+' %';
function figu(i,n){const s=SP[i],rara=s[4]<.5,mit=s[4]<.05;return `<div class="figu${mit?' mit':rara?' rara':''}" style="--r:${((s[0]*37)%7-3)*.6}deg;--d:${Math.min((n||0)*.03,.8)}s" title="${s[2]}"><div class="ph" style="background:${ZC[s.zb]}"><span class="sil s-${silDe(i)}"></span></div><em>${s[1]}</em><small>${pc(s[4])}</small></div>`}
function reiniciar(b){if(b.dataset.ok){clearTimeout(G&&G.tm);perfil()}else{b.dataset.ok=1;b.textContent='¿Seguro? Tocá de nuevo';setTimeout(()=>{if(b.isConnected){delete b.dataset.ok;b.textContent='Reiniciar'}},3000)}}
function sig(){G.k++;G.mes=G.P.cal[G.k];pintarMes()}
function titulo(n){const T=G.P.T;return n>=T[4]?'Leyenda cordobesa':n>=T[3]?'Cazador de lifers':n>=T[2]?'Ojo entrenado':n>=T[1]?'Libreta gastada':n>=T[0]?'Salidor de domingo':'Pajarero de balcón'}
function final(){const n=G.vistas.size,top=[...G.vistas].map(id=>IX[id]).sort((a,b)=>SP[a][4]-SP[b][4]).slice(0,6),mejor=G.log.slice().sort((a,b)=>b.n-a.n)[0];
 const txt=`${NOMBRE?'El año pajarero de '+NOMBRE:'Mi año pajarero'} (${G.P.n})\n${n} especies de Córdoba ${G.P.fin} · ${titulo(n)}\nMejor mes: ${MESES[mejor.m]} en ${mejor.z} (+${mejor.n})\nFigurita más difícil: ${SP[top[0]][1]}\n¿Me ganás? ${SH.url}`;
 $(`<div><p class="lab">Fin del año</p><div class="grande">${n}<small> especies</small></div><h2>de Córdoba ${G.P.fin}</h2></div>
 <span class="sello">${titulo(n)}</span>
 <div class="comp"><button class="btn big" id="bsh" onclick="compartir()" disabled>Preparando imagen…</button>
 <canvas id="cv" class="cv" aria-label="Imagen para compartir tu resultado"></canvas>
 <div class="fmt"><span>Formato</span>${Object.keys(FMT).map(k=>`<button data-f="${k}" onclick="elegirFmt('${k}')">${FMT[k].n}</button>`).join('')}<button class="lnk" id="bdl" onclick="descargar()" style="display:none">Descargar</button></div>
 </div>
 <div id="rk"></div>
 <p class="sub">Te sobraron ${G.nafta} de nafta.</p>
 <div><p class="lab" style="margin-bottom:8px">Tus figuritas más difíciles</p><div class="figus">${top.map((i,k)=>figu(i,k)).join('')}</div></div>
 <div><p class="lab" style="margin-bottom:6px">Tu camino</p><div class="recap">${G.log.map(l=>`<div><span>${MESES[l.m]} · ${l.z}</span><b>+${l.n}</b></div>`).join('')}</div></div>
 <div class="lnks"><button class="lnk" onclick="nuevo(String(Math.random()),G.modo)">Jugar otra vez</button><button class="lnk" onclick="perfil()">Cambiar de perfil</button><button class="lnk" id="cp" onclick="copiar()">Copiar texto</button></div><textarea id="txt" rows="4" readonly style="display:none">${txt}</textarea>
 <p class="pie"><a href="/">Volver a la web</a> · Frecuencias: eBird, 85.637 listas completas de Córdoba. El porcentaje de cada figurita es en cuántas listas aparece.</p>`);SH.d={n,top,titulo:titulo(n),nombre:NOMBRE,perfil:G.P.n,fin:G.P.fin,salidas:G.P.cal.length};SH.txt=txt;elegirFmt('historia');sonar(1);guardarPartida(n)}
function copiar(){const t=document.getElementById('txt'),b=document.getElementById('cp');const ok=()=>{b.textContent='Copiado'};
 (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(ok).catch(()=>{t.style.display='block';t.focus();t.select();b.textContent='Seleccionado: copialo'})}
function perfil(){document.getElementById('app').dataset.s='';$(`<div><p class="lab">Antes de salir</p><h2>¿Quién sale a pajarear?</h2></div>
 <input id="nom" class="nom" type="text" maxlength="16" placeholder="Tu nombre o alias (obligatorio)" required value="${NOMBRE.replace(/"/g,'')}" autocomplete="given-name">
 <div><p class="lab" style="margin-bottom:8px">Elegí tu perfil</p><div class="ops">${Object.keys(PERF).map((k,i)=>`<button class="op" style="--r:${[-.6,.5,-.3][i]}deg" onclick="empezar('${k}')"><b>${PERF[k].n}</b><span>${PERF[k].d}</span><small>${PERF[k].t}</small></button>`).join('')}</div></div>`)}
function empezar(m){const el=document.getElementById('nom'),v=(el||{}).value||'';if(v.trim().length<2){if(el){el.focus();el.classList.add('falta');el.placeholder='Escribí tu nombre o alias para empezar';setTimeout(()=>el.classList.remove('falta'),900)}return}NOMBRE=v.trim().slice(0,16);try{localStorage.setItem('pajarero_nombre',NOMBRE)}catch(e){}if(SND)musica(true);cargarCantos();nuevo(String(Math.random()),m)}
function slides(){const ks=['pastizal','humedal','sierras','bosque','arbustal','ocaso'];return `<div class="slides" id="sls">${ks.map((k,i)=>`<div class="sl${i?'':' on'}" style="background-image:url(data:image/svg+xml;base64,${IMG[k]})"></div>`).join('')}</div>`}
function filaRand(){const P=[[],[],[]];SP.forEach((x,i)=>P[x[4]<.5?0:x[4]<5?1:2].push(i));const pk=(L,n)=>{const o=[];while(o.length<n){const i=L[Math.floor(Math.random()*L.length)];if(!o.includes(i))o.push(i)}return o};const f=[...pk(P[0],2),...pk(P[1],4),...pk(P[2],6)];for(let i=f.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[f[i],f[j]]=[f[j],f[i]]}const h=f.map(i=>figu(i,0)).join('');return h+h}
function pasar(){const r=document.getElementById('sls');if(!r)return;if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;let i=0;const t=setInterval(()=>{if(!document.body.contains(r)){clearInterval(t);return}const L=r.children,c=L[i],n=L[(i+1)%L.length];n.style.transition='none';n.className='sl';void n.offsetWidth;n.style.transition='';n.className='sl on';c.className='sl out';i=(i+1)%L.length},3200)}
function inicio(){
 $(`<div><h1 class="hl">${LOGO}</h1><p class="sub">Salís a pajarear por Córdoba, tomás decisiones y armás tu libreta de especies. ¿Cuántas lográs sumar?</p></div>
 ${slides()}
 <p>Elegís a dónde salir y resolvés lo que te cruza el camino. Cada lugar tiene sus aves, y muchas cambian con las estaciones. Lo que encontrás se sortea con la frecuencia real de eBird: ningún año se repite.</p>
 <div class="marq"><div class="mt">${filaRand()}</div></div>
 <button class="btn" onclick="perfil()">Empezar</button>
 <div class="lnks" style="justify-content:flex-start">${API?'<button class="lnk" onclick="verRanking()">Ranking</button>':''}<button class="lnk" onclick="misPartidas()">Mis partidas</button><button class="lnk" onclick="compJuego(this)">Compartir el juego</button></div>`);pasar()}
function compJuego(b){const u='https://felixsantiago.com.ar/juego/',t='Mi año pajarero: ¿cuántas aves de Córdoba sumás en un año? Jugalo acá:';if(navigator.share){navigator.share({title:'Mi año pajarero',text:t,url:u}).catch(()=>{})}else{try{navigator.clipboard.writeText(t+' '+u).then(()=>{b.textContent='¡Link copiado!'})}catch(e){prompt('Copiá el link',u)}}}
inicio();
</script>
