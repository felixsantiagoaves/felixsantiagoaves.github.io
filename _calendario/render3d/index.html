<!doctype html><meta charset=utf-8><style>html,body{margin:0;background:#efe8dc;overflow:hidden}canvas{display:block}</style>

<script type="module">
import * as THREE from 'three';
const W=innerWidth,H=innerHeight;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0xefe8dc);

const dl=new THREE.DirectionalLight(0xfff4e4,1.6);dl.position.set(-260,420,300);dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);

const fl2=new THREE.DirectionalLight(0xfff4e4,1.0);fl2.position.set(220,320,-420);sc.add(fl2);

const F=95,h=F*Math.sin(Math.PI/3),CREAM=0xf3ece1,D=Math.PI/180;
const cart=new THREE.MeshStandardMaterial({color:CREAM,roughness:.9,side:THREE.DoubleSide});
function face(w,hh,x,y,z,rx,mat){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,hh),mat||cart);m.position.set(x,y,z);m.rotation.x=rx;m.castShadow=m.receiveShadow=true;sc.add(m);return m}
// textura trasera
const cv=document.createElement('canvas');cv.width=2100;cv.height=950;const cx=cv.getContext('2d');cx.fillStyle='#f3ece1';cx.fillRect(0,0,2100,950);

const t=document.createElement('canvas');t.width=logo.width;t.height=logo.height;const tc=t.getContext('2d');tc.drawImage(logo,0,0);tc.globalCompositeOperation='source-in';tc.fillStyle='#2f3a1e';tc.fillRect(0,0,t.width,t.height);
const lh=230,lw=lh*logo.width/logo.height;cx.drawImage(t,1050-lw/2,190,lw,lh);
cx.fillStyle='#2f3a1e';cx.textAlign='center';cx.font='600 52px Georgia,serif';cx.letterSpacing='22px';cx.fillText('FÉLIX SANTIAGO · AVES',1060,540);
cx.letterSpacing='0px';cx.font='italic 50px Georgia,serif';cx.fillText('Calendario de escritorio 2027',1050,640);cx.font='italic 40px Georgia,serif';cx.fillText('felixsantiago.com.ar',1050,720);
const bt=new THREE.CanvasTexture(cv);bt.colorSpace=THREE.SRGBColorSpace;bt.anisotropy=8;
// el plano trasero se ve desde afuera: espejar no hace falta (cara con rotacion x=-150 queda al derecho)
face(210,F,0,h/2,F/4,-30*D);
const back=face(210,F,0,h/2,-F/4,-150*D,new THREE.MeshStandardMaterial({map:bt,roughness:.9,side:THREE.FrontSide}));back.rotation.z=Math.PI;back.rotation.x=-150*D+0; 
face(210,F,0,0.02,0,Math.PI/2);
const tri=new THREE.Shape();tri.moveTo(-F/2,0);tri.lineTo(F/2,0);tri.lineTo(0,h);
for(const sx of[-1,1]){const m=new THREE.Mesh(new THREE.ShapeGeometry(tri),cart);m.rotation.y=sx*Math.PI/2;m.position.x=sx*105;m.castShadow=true;sc.add(m)}
// anillos
const ringM=new THREE.MeshStandardMaterial({color:0x1b1b1b,metalness:.6,roughness:.35});
for(let i=-8;i<=8;i++){const g=new THREE.Mesh(new THREE.TorusGeometry(4.6,.75,10,32),ringM);g.rotation.y=Math.PI/2;g.position.set(i*12.7,h+.5,0);g.castShadow=true;sc.add(g)}
// paginas
const N=13,pages=[],tl=new THREE.TextureLoader();
const blank=new THREE.MeshStandardMaterial({color:CREAM,roughness:.9});
const tex=await Promise.all([...Array(N)].map((_,i)=>tl.loadAsync('/tex/p'+String(i).padStart(2,'0')+'.jpg')));
for(let i=0;i<N;i++){tex[i].colorSpace=THREE.SRGBColorSpace;tex[i].anisotropy=8;
 const g=new THREE.Group();g.position.set(0,h,0);
 const a=new THREE.Mesh(new THREE.PlaneGeometry(210,99),new THREE.MeshStandardMaterial({map:tex[i],roughness:.8}));a.position.y=4-49.5;a.castShadow=a.receiveShadow=true;
 const b=new THREE.Mesh(new THREE.PlaneGeometry(210,99),blank);b.rotation.y=Math.PI;b.position.set(0,4-49.5,-.02);b.receiveShadow=true;
 g.add(a,b);sc.add(g);pages.push({g,a,b})}
const T=.38;
const flipAt=[3.3,5.6,7.9],FD=1.3;
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
function setT(s){
 for(let i=0;i<N;i++){let u=0;if(i<flipAt.length)u=Math.min(1,Math.max(0,(s-flipAt[i])/FD));const e=ease(u);
  const zf=(N-i)*T+.3, zb=-(i+1)*T-.3;const z=zf+(zb-zf)*e+Math.sin(Math.PI*u)*1.5;
  const p=pages[i];p.g.rotation.x=(-30-300*e)*D;p.a.position.z=z;p.b.position.z=z-.02;
  // curvatura simple: levantar suavemente durante el giro
 }
 const k=(a,b,x)=>Math.min(1,Math.max(0,(x-a)/(b-a)));const sm=u=>u*u*(3-2*u);
 let az,el,rad;
 if(s<3){const u=sm(k(0,3,s));az=38-18*u;el=15+2*u;rad=470-80*u}
 else if(s<9.6){const u=sm(k(3,9.6,s));az=20-12*u;el=17+6*u;rad=390-40*u}
 else{const u=sm(k(9.6,15,s));az=8+160*u;el=23-5*u;rad=350+80*u}
 az*=D;el*=D;const tg=new THREE.Vector3(0,40,0);
 cam.position.set(tg.x+rad*Math.sin(az)*Math.cos(el),tg.y+rad*Math.sin(el),tg.z+rad*Math.cos(az)*Math.cos(el));cam.lookAt(tg);
 r.render(sc,cam);
}
window.setT=setT;window.ready=true;setT(0);
</script>
